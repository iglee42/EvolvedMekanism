name: Build
on:
  workflow_dispatch:
    inputs:
      is-release:
        description: 'Publish release to Modrinth, Curseforge and Github'
        required: false
        default: false
        type: boolean
      dry-run:
        description: 'Dry Run the release, only send Discord Webhook'
        required: false
        default: true
        type: boolean

env:
  JAVA_VERSION: ${{
    github.base_ref == '1.20.1' && '17' ||
    github.base_ref == '1.21.1' && '21' ||
    github.base_ref == '26.1' && '25' ||
    github.ref_name == '1.20.1' && '17' ||
    github.ref_name == '1.21.1' && '21' ||
    github.ref_name == '26.1' && '25' ||
    '21'
    }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-disabled: ${{ inputs.is-release }}
          cache-read-only: false

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew build

      - name: Maven Release
        if: ${{ inputs.is-release && !inputs.dry-run }}
        env:
          MAVEN_USERNAME: ${{ secrets.MAVEN_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.MAVEN_PASSWORD }}
        run: ./gradlew publish

      - name: Publish
        if: ${{ inputs.is-release }}
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          DISCORD_WEBHOOK_DRY_RUN: ${{ secrets.DISCORD_WEBHOOK_DRY_RUN }}
          DRY_RUN: ${{ inputs.dry-run }}
        run: |
          chmod +x gradlew
          if ./gradlew tasks --all | grep -q "publishMods"; then
            ./gradlew publishMods
          else
            echo "publishMods task not available, skipping."
          fi